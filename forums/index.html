  	<body>
    	<div id="p5js"></div>
    	<main>
    	
    		<a href="../index.html">Home</a>
    		<a href="post/index.html">Create Post</a>
    		<a href="#" onclick="reload()">Refresh</a>
    		<a href="#" onclick="changeCategory(0)">Official</a>
    		<a href="#" onclick="changeCategory(1)">Main</a>
    		<a href="#" onclick="changeCategory(2)">Politics</a>
    		<a href="#" onclick="changeCategory(3)">Help</a>
    		
    		<div>
		      	<h1 class="center-text">Hello, welcome to the FORUMS!</h1>
		      	<h2 class="center-text">Please be respectful of others when posting.</h2>
	      	</div>
	      	<hr>
      		
      		
      		<div id="posts"></div>
      		
      		<script>
      			async function loadPost(nextpost, category) {
	      			const response = await fetch(
						"https://forum-api.mrduckytesla.com/api/post/get?" +
						new URLSearchParams({
							num: nextpost,
							username: localStorage.getItem("username"),
							authkey: localStorage.getItem("authKey"),
							cat: category
						})
					);
	      			
	
					if (response.ok) {
						
						const post = await response.text();
						const params = new URLSearchParams(post);
						
						const postElement = document.createElement("div");
						postElement.style.textAlign = "center";
						postElement.style.position = "relative";
						postElement.style.paddingTop = "50px";
						
						const pfp = document.createElement("img");
						pfp.src = "https://avatars.githubusercontent.com/u/"+params.get("git")+"?size=64";
						pfp.width="64"; pfp.height="64";
						
						const author = document.createElement("p");
						author.textContent = params.get("author");
						
						const title = document.createElement("h2");
						title.textContent = params.get("title");
						
						const time = document.createElement("p");
						time.textContent = new Date(Number(params.get("time"))).toLocaleString();
						
						const message = document.createElement("p");
						message.textContent = params.get("message");
						
						const corner = document.createElement("div");
						corner.style.display = "flex";
						corner.style.alignItems = "center";
						corner.style.gap = "10px";
						corner.style.position = "absolute";
						corner.style.left = "20px";
						corner.style.top = "-40px";
						
						corner.appendChild(pfp);
						corner.appendChild(author);
						corner.appendChild(time);
						
						postElement.appendChild(corner);
						postElement.appendChild(title);
						postElement.appendChild(message);
						
						document.getElementById("posts").appendChild(postElement);
						document.getElementById("posts").appendChild(document.createElement("hr"));
						
						console.log(post);
	      	        }
	      		}
      			
      			let nextpost, category = 0;
      			localStorage.setItem("cat", 0);
      			
      			async function loadPosts() {
	      			const countResponse = await fetch(
	      				"https://forum-api.mrduckytesla.com/api/post/count?" +
	      				new URLSearchParams({cat: category})
	      			);
	      			const postnum = Number(await countResponse.text());
	      			
	      			nextpost = postnum - 1;
	      			
	      			for (let i = 0; i < 10 && nextpost >= 0; i++) {await loadPost(nextpost--, category);}
      			} loadPosts();
      			
      			async function changeCategory(cat) {
      				category = cat;
      				localStorage.setItem("cat", cat);
      				reload();
      			}
      			
      			async function reload() {
      				document.getElementById("posts").innerHTML = "";
					await loadPosts();
      			}
      			
      			let loading = false;
      			window.addEventListener("scroll", async () => {
      				if (loading == false && nextpost >= 0 && window.innerHeight + window.scrollY >= document.body.offsetHeight - 500) {
      					loading = true; for (let i = 0; i < 10 && nextpost >= 0; i++) {await loadPost(nextpost--, category);}
      				} loading = false;
      			})
				
      		</script>
      		
    	</main>
    	
    	
    	<div id="iframes"></div>
