<!DOCTYPE html>
<html lang="en">
  	<head>
  		<title>Forums</title>
  		<!--
    	<script src="https://cdn.jsdelivr.net/npm/p5@1.11.5/lib/p5.js"></script>
    	<script src="https://cdn.jsdelivr.net/npm/p5.sound@0.4.1/dist/p5.sound.js"></script>
    	-->
    	<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    
    	<link rel="stylesheet" type="text/css" href="../windows.css">
    	<link rel="icon" type="image/x-icon" href="../icon.ico">
    	<meta charset="utf-8" />

  	</head>
  	<body>
    	<div id="p5js"></div>
    	<main>
    		<!--
      		<a href="../../index.html">Home</a>
      		-->
      		<div class="center-text">
	      		<form id="registerForm">
					<input id="username" name="username" type="text" placeholder="Username" required>
					<input id="email" name="email" type="email" placeholder="Email" required>
					<input id="password" name="password" type="password" placeholder="Password" required>
				
					<div class="cf-turnstile" data-sitekey="0x4AAAAAAFFsRETO4onNToLy"></div>
				
					<button type="submit">Register</button>
				</form>
      		</div>
      		<script>
	      		document.getElementById("registerForm").addEventListener("submit", async (e) => {
	      			e.preventDefault();
	      			const form = new FormData(e.target);
	      			const response = await fetch("http://localhost:6767/api/users", {
	      		   	method: "POST",
	      		 		body: new URLSearchParams(form)
	      			});
	      			if (response.ok) {
	      				console.log("Registered");
	      				const verificationID = await response.text();
	      				window.top.location.href = 
	      					"https://github.com/login/oauth/authorize" + 
	      					"?client_id=Ov23ligb9LkTZoqhCuwF" + 
	      					"&scope=read:user" +
	      					"&state=" + encodeURIComponent(verificationID);
	      			} 
	      			else {console.log("Registration failed");}
	      		});
      		</script>
    	</main>
    	<!--
    	<script src="../../toolkit.js"></script>
    	<script src="../../sketch.js"></script>
    	<script src="../../backgrounds.js"></script>
    	-->
    
	</body>
</html>
