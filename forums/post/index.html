    	<script>
    		 async function checkAuth() {
    			if (localStorage.getItem("username") != null && localStorage.getItem("authKey") != null) {
		    		const response = await fetch(
		    			"https://forum-api.mrduckytesla.com/api/auth?" +
		    			new URLSearchParams({
		    				username: localStorage.getItem("username"),
		    				authkey: localStorage.getItem("authKey"),
		    				cat: localStorage.getItem("cat")
		    			})
		    		);
		    		if (!response.ok) {window.location.href = "../login/index.html";}
    			} else {window.location.href = "../login/index.html";}
    		} checkAuth();
    	</script>
    	
    	<script>
			window.addEventListener("load", () => {
				const script = document.createElement("script");
				script.src = "https://challenges.cloudflare.com/turnstile/v0/api.js";
				document.body.appendChild(script);
			});
		</script>
    
    	<link rel="stylesheet" type="text/css" href="../../style.css">
    	<link rel="icon" type="image/x-icon" href="../../icon.ico">

  	<body>
    	<div id="p5js"></div>
    	<main>
    		<a href="../index.html">Back</a>
    		
      		<h1 class="center-text">Hello, welcome to the FORUMS!</h1>
      		<h2 class="center-text">Please be respectful of others when posting.</h2>
      		
      		<form id="authForm" class="center-text">
					<input id="title" name="title" type="text" placeholder="Title" required>
					<div><textarea id="content" name="content" placeholder="Content" required></textarea></div>
				
					<div class="cf-turnstile" data-sitekey="0x4AAAAAAFFsRETO4onNToLy"></div>
				
					<p id="message"></p>
				
					<button type="submit" value="login">Post</button>
				</form>
      		
    	</main>
    	
    	<script>
	      	document.getElementById("authForm").addEventListener("submit", async (e) => {
	      		e.preventDefault();
	      		const form = new FormData(e.target);
	      		
	      		
	      		form.append("username", localStorage.getItem("username"));
	     		form.append("authkey", localStorage.getItem("authKey"));
	     		form.set("real", form.get("cf-turnstile-response"));c
	     		form.append("cat", localStorage.getItem("cat"))
	      		
	     		console.log([...form.entries()]);
	     		
	      		const response = await fetch("https://forum-api.mrduckytesla.com/api/post", {
	      	   		method: "POST", body: new URLSearchParams(form)
	      		});
	      			
	      		if (response.ok) {window.location.href = "../index.html";}
	      		else {document.getElementById("message").textContent = "Failed to create post.";}
	      		
	      	});
      	</script>
    	
    	<div id="iframes"></div>
    
  	</body>
