<!DOCTYPE html>
<html lang="en">
	<head>
  		<title>Forums Home</title>
  		<meta name="description" content="Personal website belonging to MrDuckyTesla (aka Nico Lamas)">
    	<!--<script src="https://cdn.jsdelivr.net/npm/p5@1.11.5/lib/p5.js"></script>
    	<script src="https://cdn.jsdelivr.net/npm/p5.sound@0.4.1/dist/p5.sound.js"></script>-->
    
    	<link rel="stylesheet" type="text/css" href="../../../windows.css">
    	<link rel="icon" type="image/x-icon" href="../../../icon.ico">
    	<meta charset="utf-8" />
  	</head>
  	<body>
    	<div id="p5js"></div>
    	<main>
      		<h1 class="center-text">Hello, welcome to the FORUMS!</h1>
      		<h2 class="center-text">Please be respectful of others when posting.</h2>
      		
      		<form id="authForm" class="center-text">
					<input id="title" name="title" type="text" placeholder="Title" required>
					<div><textarea id="content" name="content" placeholder="Content" required></textarea></div>
				
					<div class="cf-turnstile" data-sitekey="0x4AAAAAAFFsRETO4onNToLy"></div>
				
					<p id="message"></p>
				
					<button type="submit" value="login">Post</button>
				</form>
      		
    	</main>
    	
    	<script>
	      	document.getElementById("authForm").addEventListener("submit", async (e) => {
	      		e.preventDefault();
	      		const form = new FormData(e.target);
	      		
	      		
	      		form.append("username", localStorage.getItem("username"));
	     		form.append("authkey", localStorage.getItem("authKey"));
	     		form.set("real", form.get("cf-turnstile-response"));
	      		
	      		const response = await fetch("https://forum-api.mrduckytesla.com/api/post", {
	      	   		method: "POST", body: new URLSearchParams(form)
	      		});
	      			
	      		if (response.ok) {window.location.href = "../index.html";}
	      		else {document.getElementById("message").textContent = "Failed to create post.";}
	      		
	      	});
      	</script>
    	
    	<div id="iframes"></div>
    
  	</body>
</html>
