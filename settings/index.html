<!DOCTYPE html>
<html lang="en">
	<head>
  		<title>Settings | MrDuckyTesla.com</title>
  		
    	<!--<script src="https://cdn.jsdelivr.net/npm/p5.sound@0.4.1/dist/p5.sound.js"></script>-->
    	<script src="https://cdn.jsdelivr.net/npm/p5@1.11.5/lib/p5.js"></script>
    	
    	<script src="../toolkit.js"></script>
    	<script src="../functions.js"></script>
    	<script src="../backgrounds.js"></script>
    	<script src="../sketch.js"></script>
    
    	<link rel="stylesheet" type="text/css" href="../style.css">
    	<link rel="icon" type="image/x-icon" href="../icon.ico">
    	<meta charset="utf-8" />

  	</head>
    	<body>
    	<div id="p5js"></div>
    	<main>
    		
      		<a href="../index.html">Home</a>
      		
      		<div class="center-text">
	      		<h1>Background</h1>
	      		<div>
					<span id="bkgVal">Random</span>
					<a href="javascript:void(0)" onclick="resetBackground()">Reset</a>
				</div>
				<input type="range" id="bkg" min="0" max="5" value="5">
				<script>
					const backgrounds = ["Off", "Bouncy", "Repel", "Radial", "Follow", "Random"];
					const sliderBkg = document.getElementById("bkg");
					const outputBkg = document.getElementById("bkgVal");
					const savedBackground = getBackground();
	      			if (savedBackground !== null) {sliderBkg.value = backgrounds.indexOf(savedBackground);}
					outputBkg.textContent = backgrounds[sliderBkg.value];
					sliderBkg.addEventListener("input", () => {
						let bkg = backgrounds[sliderBkg.value];
						outputBkg.textContent = bkg;
						setBackground(bkg);
					});
				</script>
	      		<div>
	      		<span id="pixVal">Pixelation: 10%</span>
		      		<a href="javascript:void(0)" onclick="resetPixelation()">Reset</a>
	      		</div>
	      		<input type="range" id="pix" min="1" max="50" value="10">
	      		<script>
	      			const sliderPix = document.getElementById("pix");
	      			const outputPix = document.getElementById("pixVal");
	      			const savedPix = getPixelation();
	      			if (savedPix !== null) {sliderPix.value = savedPix;}
	      			outputPix.textContent = "Pixelation: "+sliderPix.value+"x";
	      			sliderPix.addEventListener("input", () => {
	      				outputPix.textContent = "Pixelation: "+sliderPix.value+"x";
	      				setPixelation(sliderPix.value);
	      			});
				</script>
	      		<div>
	      			<span id="clrBVal">Color: 60, 60, 60</span> 
	      			<a href="javascript:void(0)" onclick="resetBkgColor()">Reset</a>
	      		</div>
	      		<input type="range" id="clrBR" min="0" max="255" value="60">
	      		<input type="range" id="clrBG" min="0" max="255" value="60">
	      		<input type="range" id="clrBB" min="0" max="255" value="60">
	      		<script>
	      			const sliderBkgClrR = document.getElementById("clrBR");
	      			const sliderBkgClrG = document.getElementById("clrBG");
	      			const sliderBkgClrB = document.getElementById("clrBB");
	      			const outputBkgClr = document.getElementById("clrBVal");
	      			const savedBkgColor = getBkgColor();
	      			if (savedBkgColor !== null) {
	      				const [r, g, b] = savedBkgColor.split(", ");
	      				sliderBkgClrR.value = r; sliderBkgClrG.value = g; sliderBkgClrB.value = b;
	      			} outputBkgClr.textContent = "Color: "+getNewBkgColorStr();
					[sliderBkgClrR, sliderBkgClrG, sliderBkgClrB].forEach(slider => {
	      				slider.addEventListener("input", () => {
	      					outputBkgClr.textContent = "Color: "+getNewBkgColorStr();
	      					setBkgColor(getNewBkgColorStr());
	      				});
	      			}); function getNewBkgColorStr() {return sliderBkgClrR.value + ", " + sliderBkgClrG.value + ", " + sliderBkgClrB.value}
				</script>
	      		<h1>Opacity</h1>
	      		<div>
		      		<span id="opaVal">70%</span>
		      		<a href="javascript:void(0)" onclick="resetOpacity()">Reset</a>
	      		</div>
	      		<input type="range" id="opa" min="0" max="100" value="30">
	      		<script>
	      			const sliderOpa = document.getElementById("opa");
	      			const outputOpa = document.getElementById("opaVal");
	      			const savedOpacity = getOpacity();
	      			if (savedOpacity !== null) {sliderOpa.value = savedOpacity;}
	      			document.documentElement.style.setProperty("--bg-opacity", sliderOpa.value / 100);
	      			outputOpa.textContent = getOpacityVal(sliderOpa.value);
					sliderOpa.addEventListener("input", () => {
						let opa = getOpacityVal(sliderOpa.value);
						outputOpa.textContent = opa;
						document.documentElement.style.setProperty("--bg-opacity", sliderOpa.value / 100);
						setOpacity(sliderOpa.value);
					}); function getOpacityVal(value) {return (100-Number(value))+"%";}
				</script>
				<div>
					<span id="clrOVal">Color: 255, 255, 255</span>
					<a href="javascript:void(0)" onclick="resetOpaColor()">Reset</a>
				</div>
	      		<input type="range" id="clrOR" min="0" max="255" value="255">
	      		<input type="range" id="clrOG" min="0" max="255" value="255">
	      		<input type="range" id="clrOB" min="0" max="255" value="255">
	      		<script>
	      			const sliderOpaClrR = document.getElementById("clrOR");
	      			const sliderOpaClrG = document.getElementById("clrOG");
	      			const sliderOpaClrB = document.getElementById("clrOB");
	      			const outputOpaClr = document.getElementById("clrOVal");
	      			const savedOpaColor = getOpaColor();
	      			if (savedOpaColor !== null) {
	      				const [r, g, b] = savedOpaColor.split(", ");
	      				sliderOpaClrR.value = r; sliderOpaClrG.value = g; sliderOpaClrB.value = b;
	      			} outputOpaClr.textContent = "Color: "+getNewOpaColorStr();
	      			document.documentElement.style.setProperty("--bg-rval", sliderOpaClrR.value);
  					document.documentElement.style.setProperty("--bg-gval", sliderOpaClrG.value);
  					document.documentElement.style.setProperty("--bg-bval", sliderOpaClrB.value);
					[sliderOpaClrR, sliderOpaClrG, sliderOpaClrB].forEach(slider => {
	      				slider.addEventListener("input", () => {
	      					outputOpaClr.textContent = "Color: "+getNewOpaColorStr();
	      					setOpaColor(getNewOpaColorStr());
	      					document.documentElement.style.setProperty("--bg-rval", sliderOpaClrR.value);
	      					document.documentElement.style.setProperty("--bg-gval", sliderOpaClrG.value);
	      					document.documentElement.style.setProperty("--bg-bval", sliderOpaClrB.value);
	      				});
	      			}); function getNewOpaColorStr() {return sliderOpaClrR.value + ", " + sliderOpaClrG.value + ", " + sliderOpaClrB.value}
				</script>
				<h1>Text</h1>
				<span id="txtFVal">40px</span>
				<a href="javascript:void(0)" onclick="resetTextSize()">Reset</a>
				<div><input type="range" id="txtSize" min="10" max="100" value="40"></div>
				<script>
					const sliderTxtP = document.getElementById("txtSize");
	      			const outputTxtP = document.getElementById("txtFVal");
	      			const savedTxtP = getTextSize();
	      			if (savedTxtP !== null) {sliderTxtP.value = savedTxtP;}
	      			outputTxtP.textContent = sliderTxtP.value+"px";
	      			document.documentElement.style.setProperty("--tx-fval", sliderTxtP.value+"px");
	      			sliderTxtP.addEventListener("input", () => {
	      				outputTxtP.textContent = sliderTxtP.value+"px";
	      				document.documentElement.style.setProperty("--tx-fval", sliderTxtP.value+"px");
	      				setTextSize(sliderTxtP.value);
	      			});
				</script>
				<div>
					<span id="txtFCVal">Font Color: 0, 0, 0</span>
					<a href="javascript:void(0)" onclick="resetTextColor()">Reset</a>
				</div>
				<input type="range" id="txtClrR" min="0" max="255" value="0">
				<input type="range" id="txtClrG" min="0" max="255" value="0">
				<input type="range" id="txtClrB" min="0" max="255" value=0>
				<script>
					const sliderTxtClrR = document.getElementById("txtClrR");
	      			const sliderTxtClrG = document.getElementById("txtClrG");
	      			const sliderTxtClrB = document.getElementById("txtClrB");
	      			const outputTxtClr = document.getElementById("txtFCVal");
	      			const savedTxtColor = getTextColor();
	      			if (savedTxtColor !== null) {
	      				const [r, g, b] = savedTxtColor.split(", ");
	      				sliderTxtClrR.value = r; sliderTxtClrG.value = g; sliderTxtClrB.value = b;
	      				document.documentElement.style.setProperty("--tx-trval", sliderTxtClrR.value);
	      				document.documentElement.style.setProperty("--tx-tgval", sliderTxtClrG.value);
	      				document.documentElement.style.setProperty("--tx-tbval", sliderTxtClrB.value);
	      			} outputTxtClr.textContent = "Color: "+getNewTxtColorStr();
					[sliderTxtClrR, sliderTxtClrG, sliderTxtClrB].forEach(slider => {
	      				slider.addEventListener("input", () => {
	      					outputTxtClr.textContent = "Color: "+getNewTxtColorStr();
	      					document.documentElement.style.setProperty("--tx-trval", sliderTxtClrR.value);
		      				document.documentElement.style.setProperty("--tx-tgval", sliderTxtClrG.value);
		      				document.documentElement.style.setProperty("--tx-tbval", sliderTxtClrB.value);
	      					setTextColor(getNewTxtColorStr());
	      				});
	      			}); function getNewTxtColorStr() {return sliderTxtClrR.value + ", " + sliderTxtClrG.value + ", " + sliderTxtClrB.value}
				</script>
				<div>
					<span id="txtSVal">Stroke: 1px</span>
					<a href="javascript:void(0)" onclick="resetStrokeSize()">Reset</a>
				</div>
				<input type="range" id="txtStroke" min="0" max="3" value="1">
				<script>
					const sliderStrP = document.getElementById("txtStroke");
	      			const outputStrP = document.getElementById("txtSVal");
	      			const savedStrP = getStrokeSize();
	      			if (savedStrP !== null) {sliderStrP.value = savedStrP;}
	      			outputStrP.textContent = "Stroke: "+sliderStrP.value+"px";
	      			document.documentElement.style.setProperty("--tx-sval", sliderStrP.value+"px");
	      			sliderStrP.addEventListener("input", () => {
	      				outputStrP.textContent = "Stroke: "+sliderStrP.value+"px";
	      				document.documentElement.style.setProperty("--tx-sval", sliderStrP.value+"px");
	      				setStrokeSize(sliderStrP.value);
	      			});
				</script>
				<div>
					<span id="txtSCVal">Stroke Color: 255, 255, 255</span>
					<a href="javascript:void(0)" onclick="resetStrokeColor()">Reset</a>
				</div>
				<input type="range" id="txtStrR" min="0" max="255" value="255">
				<input type="range" id="txtStrG" min="0" max="255" value="255">
				<input type="range" id="txtStrB" min="0" max="255" value="255">
				<script>
					const sliderStrClrR = document.getElementById("txtStrR");
	      			const sliderStrClrG = document.getElementById("txtStrG");
	      			const sliderStrClrB = document.getElementById("txtStrB");
	      			const outputClrStr = document.getElementById("txtSCVal");
	      			const savedStrColor = getStrokeColor();
	      			if (savedStrColor !== null) {
	      				const [r, g, b] = savedStrColor.split(", ");
	      				sliderStrClrR.value = r; sliderStrClrG.value = g; sliderStrClrB.value = b;
	      				document.documentElement.style.setProperty("--tx-srval", sliderStrClrR.value);
	      				document.documentElement.style.setProperty("--tx-sgval", sliderStrClrG.value);
	      				document.documentElement.style.setProperty("--tx-sbval", sliderStrClrB.value);
	      			} outputClrStr.textContent = "Stroke Color: "+getNewStrColorStr();
					[sliderStrClrR, sliderStrClrG, sliderStrClrB].forEach(slider => {
	      				slider.addEventListener("input", () => {
	      					outputClrStr.textContent = "Stroke Color: "+getNewStrColorStr();
	      					document.documentElement.style.setProperty("--tx-srval", sliderStrClrR.value);
		      				document.documentElement.style.setProperty("--tx-sgval", sliderStrClrG.value);
		      				document.documentElement.style.setProperty("--tx-sbval", sliderStrClrB.value);
	      					setStrokeColor(getNewStrColorStr());
	      				});
	      			}); function getNewStrColorStr() {return sliderStrClrR.value + ", " + sliderStrClrG.value + ", " + sliderStrClrB.value}
				</script>
			</div>
    	</main>
    
  	</body>
</html>
